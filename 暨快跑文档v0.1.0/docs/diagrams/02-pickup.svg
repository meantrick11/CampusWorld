<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1110" viewBox="0 0 1240 1110">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#63748b"/></marker></defs>
<rect width="1240" height="1110" fill="#ffffff"/>
<text x="60" y="56.166666666666664" font-family="Microsoft YaHei, sans-serif" font-size="26" fill="#24344c">暨快跑｜动态码与取件流程 · v0.1.0</text>
<text x="60" y="108.33333333333333" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#24344c">编号实线：主路径 ｜ 灰虚线：条件分支 ｜ 蓝：业务步骤 ｜ 橙：待定／外部依赖 ｜ 红：异常</text>
<rect x="90" y="155" width="380" height="86" rx="12" fill="#eaf2ff" stroke="#3974c6"/>
<text x="280.0" y="189" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#24344c">需用户即时配合的订单</text>
<text x="280.0" y="215" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#24344c">接单前选到站区间并同步用户</text>
<rect x="90" y="305" width="380" height="86" rx="12" fill="#eaf2ff" stroke="#3974c6"/>
<text x="280.0" y="339" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#24344c">点击“索要动态码”</text>
<text x="280.0" y="365" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#24344c">通知用户；较久未回可电话联系</text>
<rect x="90" y="455" width="380" height="86" rx="12" fill="#fff3db" stroke="#bc7d16"/>
<text x="280.0" y="489" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#24344c">用户响应并上传</text>
<text x="280.0" y="515" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#24344c">三分钟有效期需现场核实</text>
<rect x="90" y="605" width="380" height="86" rx="12" fill="#fff3db" stroke="#bc7d16"/>
<text x="280.0" y="639" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#24344c">驿站核验代取权限</text>
<text x="280.0" y="665" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#24344c">核对本单包裹，授权方式待核实</text>
<rect x="90" y="755" width="380" height="86" rx="12" fill="#eaf2ff" stroke="#3974c6"/>
<text x="280.0" y="789" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#24344c">实际取得正确物品</text>
<text x="280.0" y="815" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#24344c">拿到码不等于取件完成</text>
<rect x="90" y="905" width="380" height="86" rx="12" fill="#eaf2ff" stroke="#3974c6"/>
<text x="280.0" y="939" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#24344c">确认已取件，开始配送</text>
<text x="280.0" y="965" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#24344c">送往用户指定交付位置</text>
<rect x="780" y="455" width="380" height="86" rx="12" fill="#ffebeb" stroke="#bf5050"/>
<text x="970.0" y="489" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#24344c">联系失败，实际尚未取件</text>
<text x="970.0" y="515" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#24344c">按约到站等待三分钟可自行终止</text>
<rect x="780" y="605" width="380" height="86" rx="12" fill="#ffebeb" stroke="#bf5050"/>
<text x="970.0" y="639" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#24344c">拒绝代取／物品不符</text>
<text x="970.0" y="665" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#24344c">暂停，联系用户协商</text>
