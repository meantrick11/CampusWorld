<text x="302.0" y="278.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#42536b">1)</text>
<path d="M280.0 391 L280.0 455" stroke="#63748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="302.0" y="428.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#42536b">2)</text>
<path d="M280.0 541 L280.0 605" stroke="#63748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="302.0" y="578.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#42536b">3)</text>
<path d="M280.0 691 L280.0 755" stroke="#63748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="302.0" y="728.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#42536b">4)</text>
<path d="M280.0 841 L280.0 905" stroke="#63748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="302.0" y="878.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#42536b">5)</text>
<path d="M280.0 991 L280.0 1055" stroke="#63748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="302.0" y="1028.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#42536b">6)</text>
<path d="M470 348.0 L780 348.0" stroke="#63748b" stroke-width="1.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="625.0" y="338.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#42536b">异常</text>
<path d="M470 498.0 L780 498.0" stroke="#63748b" stroke-width="1.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="625.0" y="488.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#42536b">超时</text>
<path d="M470 798.0 L780 798.0" stroke="#63748b" stroke-width="1.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="625.0" y="788.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#42536b">异常</text>
</svg>